[workspace]
members = [
    "crates/torrent_core",
    "crates/torrent_engine",
    "crates/metadata_engine",
    "crates/streaming_engine",
    "crates/player_bridge",
    "crates/performance_engine",
    "crates/reliability_engine",
    "crates/download_manager",
    "crates/media_enhancement",
    "crates/search_engine",
    "crates/ffi_bridge",
]
resolver = "2"

[workspace.package]
edition    = "2021"
version    = "0.1.0"
authors    = ["TorStream Team"]
license    = "MIT"
repository = "https://github.com/your-org/tor_stream"

# ── Shared dependency versions ────────────────────────────────────────────────
[workspace.dependencies]
tokio              = { version = "1",     features = ["full"] }
serde              = { version = "1",     features = ["derive"] }
serde_json         = "1"
toml               = "1.1.3+spec-1.1.0"
thiserror          = "2"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3",  features = ["env-filter", "json"] }
tokio-util         = { version = "0.7",  features = ["rt"] }
rusqlite           = { version = "0.40.1", features = ["bundled"] }
bytes              = "1"
hex                = "0.4"
regex              = "1"
dashmap            = "6"
once_cell          = "1"
jni                = "=0.21.1"
flutter_rust_bridge = "2"

# ── Phase 2: BitTorrent engine ─────────────────────────────────────────────────
# librqbit — pure-Rust async BitTorrent library (Tokio-native, Android-compatible).
# Used instead of libtorrent-rasterbar C++ bindings, which have no stable Rust crate.
# Flutter never knows this library exists — it is fully hidden behind our API.
librqbit = { version = "9.0.0-rc.0", default-features = false, features = [
    "http-api-client",
] }

# ── Patches: pure-Rust SHA1 replacement for librqbit-sha1-wrapper ─────────────
# Upstream uses aws-lc-rs (needs NASM/CMake) or crypto-hash (needs OpenSSL).
# This patch replaces both with pure Rust sha1 crate — no native deps needed.
[patch.crates-io]
librqbit-sha1-wrapper = { path = "patches/librqbit-sha1-wrapper" }

# ── Release profile: small + fast .so for Android ────────────────────────────
[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"

# ── Dev profile ───────────────────────────────────────────────────────────────
[profile.dev]
opt-level = 0
debug     = true
