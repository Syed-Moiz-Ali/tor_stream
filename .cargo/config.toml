# ─────────────────────────────────────────────────────────────────────────────
# TorStream — Cargo cross-compilation config for Android NDK
#
# NDK assumed at: %LOCALAPPDATA%\Android\sdk\ndk\27.2.12479018
# On Linux CI: /usr/local/lib/android/sdk/ndk/27.2.12479018
#
# NOTE: If you use `cargo ndk` (recommended, installed by scripts/setup.ps1),
#       you do NOT need to set linker paths here — cargo-ndk handles them.
#       These entries are provided as a fallback for manual builds.
#
# Update NDK_VERSION and NDK_HOST_TAG if your environment differs.
# ─────────────────────────────────────────────────────────────────────────────

[build]
