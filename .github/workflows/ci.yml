name: TorStream CI

on:
  push:
    branches: [main, 'phase/**', 'feature/**']
  pull_request:
    branches: [main]

jobs:
  rust-test:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings

  rust-audit:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo install cargo-audit
      - run: cargo audit

  flutter-test:
    name: Flutter Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: stable
      - name: Install NDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"
      - name: Setup NDK link
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
      - name: Build Rust libraries
        working-directory: rust
        run: |
          cargo build --release --target aarch64-linux-android
          cargo build --release --target armv7-linux-androideabi
          cargo build --release --target x86_64-linux-android
      - name: Copy .so to jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp rust/target/aarch64-linux-android/release/lib*.so android/app/src/main/jniLibs/arm64-v8a/
          cp rust/target/armv7-linux-androideabi/release/lib*.so android/app/src/main/jniLibs/armeabi-v7a/
          cp rust/target/x86_64-linux-android/release/lib*.so android/app/src/main/jniLibs/x86_64/
      - name: Build Flutter APK
        run: flutter build apk --release --target-platform android-arm64,android-arm,android-x64
      - uses: actions/upload-artifact@v4
        with:
          name: tor-stream-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  flutter-integration-test:
    name: Flutter Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: stable
      - run: flutter pub get
      - run: flutter test integration_test/
